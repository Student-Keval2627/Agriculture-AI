<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Agriculture AI | Farm History</title>
  <link rel="stylesheet" href="../css/farm-history.css" />
</head>
<body>
  <main class="page-container">
    <a class="back-link" href="../index.html">← Back to Dashboard</a>

    <section class="hero">
      <p class="eyebrow">MONGODB FARM RECORDS</p>
      <h1>Your farm activity history</h1>
      <p>See all saved recommendations and guidance in one place.</p>
    </section>

    <section class="stat-grid">
      <article class="stat-card">
        <span>🌱</span>
        <div>
          <p>Crop Plans</p>
          <h2 id="cropCount">0</h2>
        </div>
      </article>

      <article class="stat-card">
        <span>🔎</span>
        <div>
          <p>Disease Checks</p>
          <h2 id="diseaseCount">0</h2>
        </div>
      </article>

      <article class="stat-card">
        <span>🧪</span>
        <div>
          <p>Fertilizer Advice</p>
          <h2 id="fertilizerCount">0</h2>
        </div>
      </article>

      <article class="stat-card">
        <span>💧</span>
        <div>
          <p>Irrigation Checks</p>
          <h2 id="irrigationCount">0</h2>
        </div>
      </article>
    </section>

    <section class="history-card">
      <div class="history-header">
        <div>
          <p class="eyebrow">RECENT ACTIVITY</p>
          <h2>All saved farm guidance</h2>
        </div>
        <button id="refreshButton" type="button">↻ Refresh</button>
      </div>

      <div class="filter-row">
        <button class="filter-button active" data-filter="all">All</button>
        <button class="filter-button" data-filter="crop">🌱 Crop</button>
        <button class="filter-button" data-filter="disease">🔎 Disease</button>
        <button class="filter-button" data-filter="fertilizer">🧪 Fertilizer</button>
        <button class="filter-button" data-filter="irrigation">💧 Irrigation</button>
      </div>

      <div id="activityList" class="activity-list">
        <p class="loading-text">Loading your farm history...</p>
      </div>
    </section>
  </main>

  <script src="../js/farm-history.js"></script>
</body>
</html>
